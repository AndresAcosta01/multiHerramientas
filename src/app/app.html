<div class="shell">
  <aside class="menu">
    <a class="marca" routerLink="/">
      <svg class="sello" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="2" width="9" height="9" rx="2.5" fill="#a3cbf0" />
        <rect x="13" y="2" width="9" height="9" rx="2.5" fill="#9bd9b7" />
        <rect x="2" y="13" width="9" height="9" rx="2.5" fill="#f5bd97" />
        <rect x="13" y="13" width="9" height="9" rx="2.5" fill="#d9aae3" />
      </svg>
      MultiHerramientas
    </a>

    <p class="grupo">Herramientas</p>
    <nav aria-label="Herramientas">
      @for (h of herramientas; track h.id) {
        <a class="item" [routerLink]="h.ruta" routerLinkActive="activa" ariaCurrentWhenActive="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="h.icono" /></svg>
          <span>{{ h.nombre }}</span>
        </a>
      }
    </nav>
  </aside>

  <header class="barra">
    <button class="menu-btn" type="button" aria-label="Herramientas" [attr.aria-expanded]="menuAbierto()" (click)="menuAbierto.set(!menuAbierto())">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
    </button>
    <p class="migas">
      <span class="raiz">MultiHerramientas</span>
      <span class="sep" aria-hidden="true">/</span>
      <span class="actual">{{ actual() }}</span>
    </p>
    <p class="estado">
      <span class="punto-estado" aria-hidden="true"></span>
      Sin guardar: se borra al recargar
    </p>
  </header>

  @if (menuAbierto()) {
    <nav class="hoja" aria-label="Herramientas">
      @for (h of herramientas; track h.id) {
        <a class="item" [routerLink]="h.ruta" routerLinkActive="activa" (click)="menuAbierto.set(false)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="h.icono" /></svg>
          <span>{{ h.nombre }}</span>
        </a>
      }
    </nav>
  }

  <main class="contenido">
    <router-outlet />
  </main>
</div>
